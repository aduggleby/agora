<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard a3-row-menu</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Instrument+Serif&display=swap" rel="stylesheet"><script src="./common.js"></script><script src="https://cdn.tailwindcss.com/3.4.16"></script><script>tailwind.config = window.tw;</script><style>input[type=checkbox]{accent-color:#C4663A}.tip:hover .tipbox,.tip:focus .tipbox{opacity:1;transform:none}</style></head><body class="bg-cream font-body text-ink min-h-screen">
<div id="hdr"></div>
<main class="max-w-6xl mx-auto px-4 py-6 space-y-5">
  <div id="up"></div>
  <section class="bg-white rounded-2xl border border-border overflow-hidden">
    <div class="px-3 sm:px-5 pt-3 border-b border-border bg-cream-dark/50 flex items-end justify-between gap-3">
      <nav class="flex gap-1" role="tablist">
        <button role="tab" data-tab="mine" class="tab px-4 py-2.5 text-sm font-medium border-b-2">My shares <span class="ml-1 text-xs text-ink-muted">9</span></button>
        <button role="tab" data-tab="rx" class="tab px-4 py-2.5 text-sm font-medium border-b-2">Received <span class="ml-1 inline-flex items-center justify-center min-w-5 h-5 px-1.5 rounded-full bg-terra text-white text-[11px]">2 new</span></button>
      </nav>
      <span class="hidden sm:block pb-3 text-xs text-ink-muted" id="hint"></span>
    </div>
    <div id="mine" class="overflow-x-auto"></div>
    <div id="rx" class="hidden">
      <div class="px-5 py-3 border-b border-border/60">
        <p class="text-xs text-ink-muted">Files people sent through your upload link <span class="font-mono text-ink-light">files.dualconsult.net/u/ab12cd34ef56</span> <a href="#" class="text-terra hover:underline ml-1">Copy</a></p>
      </div>
      <div id="rxBatchSlot"></div>
      <ul id="rxlist" class="divide-y divide-border/60"></ul>
      <div class="px-5 py-3 text-xs text-ink-muted border-t border-border/60">Received files expire with your default share expiry. <a href="#" class="text-terra hover:underline">Show history (deleted and expired)</a></div>
    </div>
  </section>
</main>
<dialog id="linkDlg" class="rounded-2xl border border-border p-0 w-[28rem] max-w-[92vw] backdrop:bg-ink/30"><div class="p-5"><h3 class="font-display text-2xl">Share link</h3><p class="text-xs text-ink-muted mt-1" data-name></p><div class="mt-3 flex gap-2"><input readonly value="https://files.dualconsult.net/s/Q8jqFDD7" class="flex-1 px-3 py-2 text-sm font-mono rounded-md border border-border bg-cream"><button class="px-3 py-2 text-sm rounded-md bg-terra text-white">Copy</button></div><div class="mt-4 text-right"><button class="text-sm text-ink-muted hover:underline" onclick="linkDlg.close()">Close</button></div></div></dialog>
<script>
hdr.innerHTML = header(); up.innerHTML = uploadStrip();
const tip = `<span class="tip relative inline-flex shrink-0" tabindex="0"><span class="rounded-md bg-terra-wash px-2 py-0.5 text-[11px] font-medium text-terra cursor-help">Direct link</span><span role="tooltip" class="tipbox pointer-events-none absolute left-0 top-full mt-2 z-20 w-72 rounded-lg border border-border bg-ink text-cream text-xs leading-relaxed p-3 shadow-lg opacity-0 translate-y-1 transition"><strong class="block text-white mb-0.5">Direct link</strong>The link opens the file itself (a PDF or image shows in the browser, HTML downloads), without a download page. It expires after at most 7 days and can't be password protected or re-enabled.</span></span>`;
const batchBar = (id, canReenable) => `<div id="${id}" class="hidden px-5 py-2.5 border-b border-border/60 bg-terra-wash/60 flex items-center justify-between gap-3"><span class="text-xs text-ink-light"><span data-count>0</span> selected · <a href="#" class="text-terra hover:underline" data-clear>Clear</a></span><div class="relative"><button class="px-3 py-1.5 text-xs font-medium rounded-md border border-border bg-white inline-flex items-center gap-1" data-menu-btn>Batch actions <span aria-hidden="true">▾</span></button><div class="hidden absolute right-0 mt-1 w-56 rounded-lg border border-border bg-white shadow-lg py-1 z-10" data-menu>${canReenable ? '<button class="w-full text-left px-3 py-2 text-xs hover:bg-cream-dark/60" data-reenable>Re-enable for 24 hours</button>' : ''}<button class="w-full text-left px-3 py-2 text-xs text-danger hover:bg-danger-wash">Delete selected</button></div></div></div>`;
const MODE = 'menu';
const rowMenu = (items) => `<div class="relative" data-rowmenu><button class="w-8 h-8 rounded-md text-ink-light text-lg leading-none hover:bg-cream-dark grid place-items-center" aria-label="More actions" data-rowmenu-btn>⋯</button><div class="hidden absolute right-0 mt-1 w-44 rounded-lg border border-border bg-white shadow-lg py-1 z-10 text-left" data-rowmenu-list>${items}</div></div>`;
const mi = (label, cls = '') => `<button class="w-full text-left px-3 py-2 text-xs hover:bg-cream-dark/60 ${cls}">${label}</button>`;
const dates = (created, until, expired, first = 'Uploaded') => `<div class="text-xs text-ink-muted whitespace-nowrap leading-5 grid grid-cols-[4.5rem_6.5rem] gap-x-1.5 [&>*:nth-child(odd)]:text-right"><span>${first}:</span><span>${created}</span><span class="${expired ? 'text-danger' : ''}">${expired ? 'Expired' : 'Expires'}:</span><span class="${expired ? 'text-danger' : ''}">${until}</span></div>`;
const rightSide = (expired, primary = 'Show link') => {
  if (MODE === 'inline') return `<a class="text-terra hover:underline" href="#">${primary}</a>${expired ? '<a class="text-sage hover:underline" href="#" title="Make this share available again for 24 hours">Re-enable</a>' : ''}<a class="text-danger hover:underline" href="#">Delete</a>`;
  if (MODE === 'click') return expired ? '<a class="text-sage hover:underline" href="#" data-noopen title="Make this share available again for 24 hours">Re-enable</a>' : '';
  return rowMenu(mi(primary) + (expired ? mi('Re-enable for 24 hours', 'text-sage') : '') + mi('Delete', 'text-danger'));
};
const rowAttrs = MODE === 'inline' ? '' : ' data-open tabindex="0" role="button" title="Click to show the link"';
const shareRow = (r, i) => {
  const expired = r[3] === 'Expired';
  return `<li class="px-5 py-3 flex gap-3 items-center ${expired ? 'bg-cream-dark/50' : ''} ${MODE === 'inline' ? '' : 'cursor-pointer hover:bg-cream-dark/40'}"${rowAttrs}><input type="checkbox" data-sel data-expired="${expired}" data-direct="${r[1]}" aria-label="Select ${esc(r[0])}"><div class="min-w-0 flex-1"><div class="flex items-center gap-2 min-w-0"><span class="text-sm font-medium truncate ${expired ? 'text-ink-light' : ''}" title="${esc(r[0])}">${esc(r[0])}</span>${r[1] ? tip : ''}</div><div class="text-xs text-ink-muted mt-0.5"><a href="#" class="text-terra hover:underline" data-noopen>${r[2]}</a> · ${r[6]} download${r[6] === 1 ? '' : 's'}</div></div><div class="shrink-0 flex items-center gap-4 text-xs">${dates(r[4], r[5], expired)}${rightSide(expired)}</div></li>`;
};
const active = MY.filter(r => r[3] !== 'Expired'), expiredRows = MY.filter(r => r[3] === 'Expired');
mine.innerHTML = batchBar('mineBatch', true)
 + '<ul class="divide-y divide-border/60">' + active.map(shareRow).join('') + '</ul>'
 + `<button id="expToggle" class="w-full px-5 py-2.5 border-t border-border bg-cream-dark/40 flex items-center justify-between text-xs text-ink-light hover:bg-cream-dark/70" aria-expanded="false"><span><span id="expArrow" class="inline-block transition">▸</span> Show expired (${expiredRows.length})</span><span class="text-ink-muted">Re-enable within 7 days of expiry, then they are removed</span></button>`
 + '<ul id="expList" class="hidden divide-y divide-border/60 border-t border-border/60">' + expiredRows.map(shareRow).join('') + '</ul>';
expToggle.onclick = () => { const open = expList.classList.toggle('hidden') === false; expToggle.setAttribute('aria-expanded', open); expArrow.style.transform = open ? 'rotate(90deg)' : ''; expToggle.querySelector('span span:last-child') ; expToggle.firstElementChild.lastChild.textContent = (open ? ' Hide expired (' : ' Show expired (') + expiredRows.length + ')'; };
const wireBatch = (root, barId) => {
  const bar = document.getElementById(barId);
  const update = () => { const sel = [...root.querySelectorAll('[data-sel]:checked')]; bar.classList.toggle('hidden', sel.length === 0); bar.querySelector('[data-count]').textContent = sel.length;
    const re = bar.querySelector('[data-reenable]'); if (re) { const ok = sel.some(x => x.dataset.expired === 'true' && x.dataset.direct !== 'true'); re.disabled = !ok; re.className = 'w-full text-left px-3 py-2 text-xs ' + (ok ? 'hover:bg-cream-dark/60' : 'text-ink-muted cursor-not-allowed'); re.title = ok ? 'Re-enables the selected expired shares for 24 hours' : 'Select an expired share (direct links cannot be re-enabled)'; } };
  root.addEventListener('change', e => { if (e.target.matches('[data-sel]')) update(); });
  bar.querySelector('[data-menu-btn]').onclick = () => bar.querySelector('[data-menu]').classList.toggle('hidden');
  bar.querySelector('[data-clear]').onclick = e => { e.preventDefault(); root.querySelectorAll('[data-sel]').forEach(x => x.checked = false); bar.querySelector('[data-menu]').classList.add('hidden'); update(); };
};
wireBatch(mine, 'mineBatch');
rxlist.innerHTML = RX.map(r => `<li class="px-5 py-3 flex gap-3 items-center ${r[6]?'bg-terra-wash/50':''} ${MODE === 'inline' ? '' : 'cursor-pointer hover:bg-cream-dark/40'}"${MODE === 'inline' ? '' : ' data-open tabindex="0" role="button" title="Click to download"'}><input type="checkbox" data-sel aria-label="Select ${esc(r[0])}"><div class="min-w-0 flex-1"><div class="flex items-center gap-2"><span class="text-sm font-medium truncate">${esc(r[0])}</span>${r[6]?'<span class="text-[11px] font-medium text-terra">New</span>':''}</div><div class="text-xs text-ink-muted mt-0.5 truncate">From ${esc(r[1])}${agentBadge(r[7])} · ${esc(r[2])} · <a href="#" class="text-terra hover:underline" data-noopen>${r[3]}</a>${r[8]?` · <span class="italic text-ink-light">“${esc(r[8])}”</span>`:''}</div></div><div class="shrink-0 flex items-center gap-4 text-xs">${dates(r[4], r[5] + ', ' + r[4].split(', ')[1], false, 'Received')}${MODE === 'inline' ? '<a class="text-terra hover:underline" href="#">Download</a><a class="text-danger hover:underline" href="#">Delete</a>' : MODE === 'menu' ? rowMenu(mi('Download') + mi('Delete', 'text-danger')) : ''}</div></li>`).join('');
rxBatchSlot.outerHTML = batchBar('rxBatch', false); wireBatch(rx, 'rxBatch');
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-rowmenu-btn]');
  document.querySelectorAll('[data-rowmenu-list]').forEach(l => { if (!btn || l !== btn.nextElementSibling) l.classList.add('hidden'); });
  if (btn) { e.stopPropagation(); const l = btn.nextElementSibling; l.classList.toggle('hidden'); const card = btn.closest('section').getBoundingClientRect(); const up = btn.getBoundingClientRect().bottom + 140 > Math.min(card.bottom, window.innerHeight); l.classList.toggle('bottom-full', up); l.classList.toggle('mb-1', up); l.classList.toggle('mt-1', !up); return; }
  const row = e.target.closest('[data-open]');
  if (row && !e.target.closest('input,[data-noopen],[data-rowmenu],.tip')) { linkDlg.querySelector('[data-name]').textContent = row.querySelector('.truncate').textContent; linkDlg.showModal(); }
});
const show = t => { document.querySelectorAll('.tab').forEach(b => { const on = b.dataset.tab===t; b.className = 'tab px-4 py-2.5 text-sm font-medium border-b-2 ' + (on ? 'border-terra text-ink' : 'border-transparent text-ink-muted hover:text-ink'); b.setAttribute('aria-selected', on); }); mine.classList.toggle('hidden', t!=='mine'); rx.classList.toggle('hidden', t!=='rx'); hint.textContent = t==='mine' ? 'Newest first · 9 shares' : '3 received · 2 new since your last visit'; };
document.querySelectorAll('.tab').forEach(b => b.onclick = () => show(b.dataset.tab)); show('mine');
</script></body></html>
